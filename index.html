<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias del Cielo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            color:#333;
        }

        header{
            background:linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)),
            url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');
            background-size:cover;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            color:white;
        }

        h1{
            font-size:60px;
        }

        .subtitulo{
            font-size:22px;
            margin:20px 0;
        }

        .boton{
            display:inline-block;
            background:gold;
            color:black;
            padding:15px 35px;
            text-decoration:none;
            border-radius:30px;
            font-weight:bold;
        }

        section{
            padding:60px 20px;
            max-width:1100px;
            margin:auto;
        }

        h2{
            text-align:center;
            margin-bottom:40px;
            color:#123d6b;
        }

        .cards{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
        }

        .card{
            background:white;
            width:300px;
            border-radius:15px;
            box-shadow:0 10px 20px rgba(0,0,0,.15);
            overflow:hidden;
        }

        .card img{
            width:100%;
            height:280px;
            object-fit:cover;
        }

        .card h3{
            padding:15px;
        }

        .card p{
            padding:0 15px 20px;
        }

        footer{
            background:#123d6b;
            color:white;
            text-align:center;
            padding:25px;
        }
    </style>
</head>

<body>

<header>
<div>

<h1>✝️ Historias del Cielo</h1>

<p class="subtitulo">
Descubre la vida de los santos y aprende de su ejemplo de fe.
</p>

<a href="#santos" class="boton">Explorar Santos</a>

</div>
</header>

<section id="santos">

<h2>Santos Destacados</h2>

<div class="cards">

<div class="card">
<img src="carlo-acutis.jpg" alt="Carlo Acutis">

<div class="card">
<img src="domingo-savio.jpg" alt="Santo Domingo Savio">

<div class="card">
<img src="pier-giorgio-frassati.jpg" alt="Pier Giorgio Frassati">

</div>

</section>

<footer>
© 2026 Historias del Cielo
</footer>

</body>
</html>
